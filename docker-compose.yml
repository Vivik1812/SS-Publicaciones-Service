version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: publicaciones_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  publicaciones-service:
  build: .
  container_name: publicaciones-service
  ports:
    - "8082:8082"
  environment:
      DB_URL: jdbc:postgresql://postgres:5432/publicaciones_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
  depends_on:
    - postgres
    - rabbitmq

notificaciones-service:
  build: ../SS-Notificaciones-Service
  container_name: notificaciones_service
  ports:
    - "8083:8083"
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USERNAME: guest
    RABBITMQ_PASSWORD: guest
  depends_on:
    - rabbitmq

volumes:
  postgres_data: